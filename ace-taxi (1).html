<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACE Taxi</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e3e6ea;--acc:#f5b301;--acc2:#16181d;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc2);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .logo{background:var(--acc);color:#000;font-weight:800;border-radius:8px;padding:3px 9px}
header .who{margin-left:auto;font-size:14px;opacity:.9;text-align:right}
header button{background:transparent;color:#fff;border:1px solid #555;border-radius:8px;padding:5px 10px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:50px;z-index:4}
nav button{border:0;background:#eef0f3;border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap;position:relative}
nav button.on{background:var(--acc);font-weight:700}
nav .dot{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:6px}
main{max-width:860px;margin:0 auto;padding:12px}
h2{margin:6px 0 10px;font-size:20px}h3{margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card[data-act]{cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.muted{color:var(--mut)}.small{font-size:13px}
.route{margin:6px 0;padding:6px 8px;background:#f7f8fa;border-radius:8px;font-size:15px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:#eef0f3}
.st-ok{background:#dcfce7;color:var(--ok)}.st-warn{background:#fef3c7;color:var(--warn)}.st-late,.st-cancel{background:#fee2e2;color:var(--bad)}.st-info{background:#dbeafe;color:var(--info)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;color:var(--ink);text-decoration:none;cursor:pointer;margin:3px 3px 3px 0;text-align:center}
.btn.primary{background:var(--acc);border-color:var(--acc);font-weight:700}
.btn.dark{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.btn.danger{color:var(--bad);border-color:#f3b4b4}
.btn.block{display:block;width:100%;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
.empty{text-align:center;color:var(--mut);padding:22px}
.warn{background:#fef3c7;border-radius:10px;padding:9px;margin:8px 0;font-size:14px}
.err{background:#fee2e2;color:var(--bad);border-radius:10px;padding:9px;margin:8px 0;font-size:14px}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #cfd4da;border-radius:10px;background:#fff}
input[type=radio],input[type=checkbox]{width:auto}
.seg{display:flex;gap:14px;margin:8px 0}
.seg label{display:flex;gap:6px;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:520px;margin:auto}
.smsbox{background:#f1f5f9;border-radius:10px;padding:10px;margin:8px 0;font-size:14px;white-space:pre-wrap}
.login{max-width:380px;margin:9vh auto;padding:0 14px}
.login .card{padding:18px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media(max-width:480px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== Données (enregistrées dans le navigateur de cet ordinateur) ====== */
const KEY='ace_taxi_local_v1', KEY_ME='ace_taxi_local_me';
const seed=()=>({users:[{id:'u0',ident:'patron',mdp:'patron',role:'patron',prenom:'Patron',nom:'ACE',tel:'',tel2:'',actif:true}],clients:[],vehicules:[],trajets:[],demandes:[],params:{patronTel:''},seq:{t:0,d:0}});
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){DB=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
let me=null;
try{const id=localStorage.getItem(KEY_ME);me=DB.users.find(u=>u.id===id&&u.actif)||null}catch(e){}
const ui={tab:null,filt:'avenir',hist:'mois'};

/* ====== Outils ====== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const plusDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return new Date(+y,+m-1,+d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const cli=id=>DB.clients.find(c=>c.id===id);
const usr=id=>DB.users.find(u=>u.id===id);
const veh=id=>DB.vehicules.find(v=>v.id===id);
const trj=id=>DB.trajets.find(t=>t.id===id);
const cliName=id=>cli(id)?cli(id).nom:'(client supprimé)';
const usrName=id=>usr(id)?(usr(id).prenom+' '+usr(id).nom).trim():'Non attribué';
const legs=t=>t.type==='ar'?['aller','retour']:['aller'];
const byTime=(a,b)=>(a.date+a.aller.heure).localeCompare(b.date+b.aller.heure);
const cleanNum=p=>String(p||'').replace(/[^\d+]/g,'');

function statut(t){
  if(t.annule)return{k:'cancel',l:'Annulé'};
  const steps=legs(t).flatMap(l=>[t[l].pris,t[l].depose]);
  const done=steps.filter(Boolean).length;
  if(done===steps.length)return{k:'ok',l:'Terminé'};
  if(done>0)return{k:'info',l:'En cours'};
  if(t.date+' '+t.aller.heure<today()+' '+nowHM())return{k:'late',l:'En retard'};
  return{k:'warn',l:'À venir'};
}
const tag=t=>{const s=statut(t);return `<span class="tag st-${s.k}">${s.l}</span>`+(t.transpId?'':' <span class="tag st-warn">Non attribué</span>')};
function nextStep(t){
  for(const l of legs(t)){
    if(!t[l].pris)return{leg:l,step:'pris'};
    if(!t[l].depose)return{leg:l,step:'depose'};
  }
  return null;
}
const stepLabel=s=>(s.leg==='retour'?'Retour : ':'')+(s.step==='pris'?'Personne prise en charge':'Personne déposée');

/* ====== SMS (ouvre l'application Messages du téléphone) ====== */
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const smsHref=(nums,body)=>'sms:'+nums.map(cleanNum).join(',')+(isIOS?'&':'?')+'body='+encodeURIComponent(body);
function smsTrajet(t){
  const a=t.aller;let s=`ACE Taxi - Trajet n°${t.num}${t.annule?' ANNULÉ':''} : ${cliName(t.clientId)} le ${fmtDate(t.date)} à ${a.heure}, de ${a.depart} à ${a.arrivee}.`;
  if(t.type==='ar'&&t.retour)s+=` Retour à ${t.retour.heure}, de ${t.retour.depart} à ${t.retour.arrivee}.`;
  if(t.vehId&&veh(t.vehId))s+=` Véhicule : ${veh(t.vehId).nom}.`;
  if(t.notes)s+=` Note : ${t.notes}`;
  return s;
}
function targetsFor(u){
  const p=[];
  if(u&&cleanNum(u.tel))p.push({lbl:'travail',num:u.tel});
  if(u&&cleanNum(u.tel2))p.push({lbl:'perso',num:u.tel2});
  if(p.length===2)return[{label:'Envoyer aux deux',nums:[p[0].num,p[1].num]},{label:'Travail seulement',nums:[p[0].num]},{label:'Perso seulement',nums:[p[1].num]}];
  if(p.length===1)return[{label:'Envoyer ('+p[0].lbl+')',nums:[p[0].num]}];
  return[];
}
const patronTargets=()=>cleanNum(DB.params.patronTel)?[{label:'Envoyer au patron',nums:[DB.params.patronTel]}]:[];
function smsBlock(body,targets,note){
  const btns=targets.map(x=>`<a class="btn primary" href="${esc(smsHref(x.nums,body))}">💬 ${esc(x.label)}</a>`).join('');
  return `<div class="smsbox">${esc(body)}</div>${btns||`<div class="warn">${esc(note||'Aucun numéro enregistré.')}</div>`}<button class="btn" data-act="copy" data-txt="${esc(body)}">Copier le texte</button>`;
}
function smsModal(title,body,targets,note){
  modal(`<h3>${esc(title)}</h3>${smsBlock(body,targets,note)}<button class="btn" data-act="closem">Fermer</button>`);
}

/* ====== Fenêtres ====== */
function modal(html){closeModal();const d=document.createElement('div');d.id='modal';d.className='overlay';d.dataset.act='closem';d.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(d)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function info(title,html){modal(`<h3>${esc(title)}</h3>${html}<button class="btn primary block" data-act="closem">OK</button>`)}

/* ====== Champs de formulaire ====== */
const inp=(l,n,v='',x='')=>`<label class="f"><span>${l}</span><input name="${n}" value="${esc(v)}" ${x}></label>`;
const sel=(l,n,opts,val,x='')=>`<label class="f"><span>${l}</span><select name="${n}" ${x}>${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
function legsFields(type,a,r){
  a=a||{};r=r||{};
  return `<div class="seg"><label><input type="radio" name="type" value="simple" ${type!=='ar'?'checked':''}> Aller simple</label><label><input type="radio" name="type" value="ar" ${type==='ar'?'checked':''}> Aller-retour</label></div>
  <div class="route"><b>Aller</b>
    ${inp('Heure','a_heure',a.heure,'type="time" required')}
    ${inp('Départ','a_dep',a.depart,'required')}
    ${inp('Arrivée','a_arr',a.arrivee,'required')}
  </div>
  <div class="route retour-box" style="display:${type==='ar'?'block':'none'}"><b>Retour</b>
    ${inp('Heure','r_heure',r.heure,'type="time"')}
    ${inp('Départ','r_dep',r.depart)}
    ${inp('Arrivée','r_arr',r.arrivee)}
  </div>`;
}
function readLegs(d){
  const aller={heure:d.a_heure,depart:(d.a_dep||'').trim(),arrivee:(d.a_arr||'').trim()};
  if(!aller.heure||!aller.depart||!aller.arrivee)return{err:"Remplissez l'heure, le départ et l'arrivée de l'aller."};
  let retour=null;
  if(d.type==='ar'){
    retour={heure:d.r_heure,depart:(d.r_dep||'').trim(),arrivee:(d.r_arr||'').trim()};
    if(!retour.heure||!retour.depart||!retour.arrivee)return{err:"Remplissez l'heure, le départ et l'arrivée du retour."};
  }
  return{aller,retour};
}
const formErr=(f,m)=>{let e=f.querySelector('.err');if(!e){e=document.createElement('div');e.className='err';f.prepend(e)}e.textContent=m;e.scrollIntoView({block:'nearest'});};

/* ====== Cartes de trajet ====== */
function legHtml(t,l,times){
  const g=t[l];
  return `<div class="route"><b>${l==='aller'?'Aller':'Retour'} ${esc(g.heure)}</b> ${esc(g.depart)} → ${esc(g.arrivee)}${times?`<div class="small muted">${g.pris?'✔ pris en charge à '+hm(g.pris):'· pas encore pris en charge'}${g.depose?' · ✔ déposé à '+hm(g.depose):''}</div>`:''}</div>`;
}
function tcard(t,mode){
  const c=cli(t.clientId);
  const head=`<div class="row sp"><b>n°${t.num} · ${esc(cliName(t.clientId))}</b><span>${tag(t)}</span></div>
    <div class="small muted">${fmtDate(t.date)} · ${esc(t.aller.heure)} · ${mode==='p'?esc(usrName(t.transpId))+' · ':''}${t.vehId&&veh(t.vehId)?esc(veh(t.vehId).nom):'sans véhicule'}</div>
    ${legs(t).map(l=>legHtml(t,l,mode==='t')).join('')}${t.notes?`<div class="small">📝 ${esc(t.notes)}</div>`:''}`;
  if(mode==='p')return `<div class="card" data-act="openT" data-id="${t.id}">${head}</div>`;
  const ns=nextStep(t);
  const probs=(t.problemes||[]).map(p=>`<div class="warn">⚠ ${hm(p.t)} : ${esc(p.txt)}</div>`).join('');
  return `<div class="card">${head}${probs}
    ${!t.annule&&ns?`<button class="btn primary block" data-act="step" data-id="${t.id}">${esc(stepLabel(ns))}</button>`:''}
    <div class="row">
      ${c&&cleanNum(c.tel)?`<a class="btn" href="tel:${esc(cleanNum(c.tel))}">📞 Appeler le client</a>`:''}
      ${!t.annule?`<button class="btn" data-act="prob" data-id="${t.id}">⚠ Signaler un problème</button><button class="btn" data-act="propose" data-id="${t.id}">➕ Proposer un autre transport</button>`:''}
    </div></div>`;
}

/* ====== Vues ====== */
const TABS={
  patron:[['accueil','Accueil'],['trajets','Trajets'],['demandes','Demandes'],['transp','Transporteurs'],['clients','Clients'],['vehic','Véhicules'],['params','Paramètres']],
  transporteur:[['planning','Mon planning'],['histo','Mes trajets'],['mesdem','Mes demandes'],['compte','Compte']]
};
const VIEWS={};
const mine=()=>DB.trajets.filter(t=>t.transpId===me.id);

VIEWS.accueil=()=>{
  const td=today();
  const list=DB.trajets.filter(t=>!t.annule&&t.date===td).sort(byTime);
  const late=list.filter(t=>statut(t).k==='late').length;
  const unass=DB.trajets.filter(t=>!t.annule&&!t.transpId&&t.date>=td).length;
  const pend=DB.demandes.filter(d=>d.statut==='attente').length;
  const lim=plusDays(30);
  const alerts=DB.vehicules.flatMap(v=>[['Contrôle technique',v.ct],['Entretien',v.entretien]].filter(([,d])=>d&&d<=lim).map(([n,d])=>({v,n,d})));
  return `<div class="toolbar"><h2 style="margin:0">Aujourd'hui</h2><button class="btn primary" data-act="newT" style="margin-left:auto">+ Nouveau trajet</button></div>
  <div class="grid"><div class="stat"><b>${list.length}</b>trajets du jour</div><div class="stat"><b>${late}</b>en retard</div><div class="stat"><b>${unass}</b>non attribués</div><div class="stat"><b>${pend}</b>demandes</div></div>
  ${list.length?list.map(t=>tcard(t,'p')).join(''):'<div class="empty">Aucun trajet aujourd\'hui</div>'}
  ${alerts.length?`<h3>Alertes véhicules</h3>${alerts.map(a=>`<div class="warn">🚗 ${esc(a.v.nom)} — ${a.n} ${a.d<td?'<b>dépassé</b>':'le '+fmtDate(a.d)}</div>`).join('')}`:''}`;
};
VIEWS.trajets=()=>{
  const td=today();
  let l=DB.trajets.slice();
  if(ui.filt==='avenir')l=l.filter(t=>t.date>=td).sort(byTime);
  else if(ui.filt==='passes')l=l.filter(t=>t.date<td).sort(byTime).reverse();
  else l.sort(byTime).reverse();
  const r=(v,t)=>`<label><input type="radio" name="filt" value="${v}" data-change="filt" ${ui.filt===v?'checked':''}> ${t}</label>`;
  return `<div class="toolbar"><div class="seg" style="margin:0">${r('avenir','À venir')}${r('passes','Passés')}${r('tous','Tous')}</div><button class="btn primary" data-act="newT" style="margin-left:auto">+ Nouveau trajet</button></div>
  ${l.length?l.map(t=>tcard(t,'p')).join(''):'<div class="empty">Aucun trajet</div>'}`;
};
VIEWS.demandes=()=>{
  const l=DB.demandes.slice().sort((a,b)=>(a.statut==='attente'?0:1)-(b.statut==='attente'?0:1)||b.created-a.created);
  return `<h2>Demandes de transport</h2><div class="muted small" style="margin-bottom:8px">Transports proposés par les transporteurs pour leur client du moment. Vous choisissez qui les fait et avec quel véhicule.</div>
  ${l.length?l.map(d=>`<div class="card"><div class="row sp"><b>Demande n°${d.num} · ${esc(cliName(d.clientId))}</b>${dTag(d)}</div>
    <div class="small muted">Proposée par ${esc(usrName(d.transpId))} · ${fmtDate(d.date)}</div>
    <div class="route"><b>Aller ${esc(d.aller.heure)}</b> ${esc(d.aller.depart)} → ${esc(d.aller.arrivee)}</div>
    ${d.retour?`<div class="route"><b>Retour ${esc(d.retour.heure)}</b> ${esc(d.retour.depart)} → ${esc(d.retour.arrivee)}</div>`:''}
    ${d.note?`<div class="small">📝 ${esc(d.note)}</div>`:''}${d.motif?`<div class="small">Motif du refus : ${esc(d.motif)}</div>`:''}
    ${d.statut==='attente'?`<button class="btn primary" data-act="accDem" data-id="${d.id}">Choisir transporteur et véhicule</button><button class="btn danger" data-act="refDem" data-id="${d.id}">Refuser</button>`:''}</div>`).join(''):'<div class="empty">Aucune demande</div>'}`;
};
const dTag=d=>d.statut==='attente'?'<span class="tag st-warn">⏳ En attente</span>':d.statut==='acceptee'?'<span class="tag st-ok">✓ Acceptée (trajet n°'+d.trajetNum+')</span>':'<span class="tag st-cancel">✕ Refusée</span>';
VIEWS.transp=()=>{
  const l=DB.users.filter(u=>u.role==='transporteur');
  return `<div class="toolbar"><h2 style="margin:0">Transporteurs</h2><button class="btn primary" data-act="newU" style="margin-left:auto">+ Nouveau transporteur</button></div>
  ${l.length?l.map(u=>`<div class="card"><div class="row sp"><b>${esc(u.prenom)} ${esc(u.nom)}</b>${u.actif?'':'<span class="tag st-cancel">Désactivé</span>'}</div>
    <div class="small muted">Identifiant : ${esc(u.ident)}</div>
    <div class="small">Travail : ${esc(u.tel||'—')} · Perso : ${esc(u.tel2||'—')}</div>
    <button class="btn" data-act="editU" data-id="${u.id}">Modifier</button></div>`).join(''):'<div class="empty">Aucun transporteur</div>'}`;
};
VIEWS.clients=()=>`<div class="toolbar"><h2 style="margin:0">Clients</h2><button class="btn primary" data-act="newC" style="margin-left:auto">+ Nouveau client</button></div>
  ${DB.clients.length?DB.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>`<div class="card"><b>${esc(c.nom)}</b><div class="small muted">${esc(c.tel||'')} ${c.adresse?'· '+esc(c.adresse):''}</div>${c.notes?`<div class="small">📝 ${esc(c.notes)}</div>`:''}<button class="btn" data-act="editC" data-id="${c.id}">Modifier</button></div>`).join(''):'<div class="empty">Aucun client</div>'}`;
VIEWS.vehic=()=>`<div class="toolbar"><h2 style="margin:0">Véhicules</h2><button class="btn primary" data-act="newV" style="margin-left:auto">+ Nouveau véhicule</button></div>
  ${DB.vehicules.length?DB.vehicules.map(v=>`<div class="card"><b>${esc(v.nom)}</b> <span class="muted">${esc(v.immat||'')}</span><div class="small muted">Contrôle technique : ${v.ct?fmtDate(v.ct):'—'} · Entretien : ${v.entretien?fmtDate(v.entretien):'—'}</div><button class="btn" data-act="editV" data-id="${v.id}">Modifier</button></div>`).join(''):'<div class="empty">Aucun véhicule</div>'}`;
VIEWS.params=()=>`<h2>Paramètres</h2>
  <div class="card"><h3>Votre numéro (patron)</h3><div class="muted small">Les transporteurs vous envoient leurs SMS (étapes, problèmes) à ce numéro.</div>
  <form data-form="patronTel">${inp('Numéro de téléphone','tel',DB.params.patronTel,'type="tel" placeholder="06 12 34 56 78"')}<button class="btn primary">Enregistrer</button></form></div>
  ${pwdCard()}
  <div class="card"><h3>Données</h3><div class="muted small">Tout est enregistré dans ce navigateur, sur cet ordinateur.</div>
  <button class="btn" data-act="demo">Ajouter des données d'exemple</button>
  <button class="btn" data-act="export">Télécharger une sauvegarde</button>
  <label class="btn" style="display:inline-block">Charger une sauvegarde<input type="file" accept=".json" data-change="import" style="display:none"></label>
  <button class="btn danger" data-act="wipe">Tout effacer</button></div>`;
const pwdCard=()=>`<div class="card"><h3>Changer mon mot de passe</h3><form data-form="pwd">${inp('Nouveau mot de passe','p1','','type="password" minlength="4" required autocomplete="new-password"')}${inp('Confirmer','p2','','type="password" minlength="4" required autocomplete="new-password"')}<button class="btn primary">Changer</button></form></div>`;

VIEWS.planning=()=>{
  const td=today();
  const open=mine().filter(t=>!t.annule&&statut(t).k!=='ok');
  const now=open.filter(t=>t.date===td).sort(byTime);
  const late=open.filter(t=>t.date<td).sort(byTime);
  const next=open.filter(t=>t.date>td).sort(byTime);
  const sec=(h,l)=>l.length?`<h3>${h}</h3>${l.map(t=>tcard(t,'t')).join('')}`:'';
  return `<h2>Mon planning</h2>${sec("Aujourd'hui",now)}${sec('Non terminés (jours passés)',late)}${sec('À venir',next)}
  ${open.length?'':'<div class="empty">Aucun trajet à faire</div>'}`;
};
VIEWS.histo=()=>{
  const td=today();
  let l=mine().filter(t=>t.annule||statut(t).k==='ok'||t.date<td);
  if(ui.hist==='semaine')l=l.filter(t=>t.date>=plusDays(-7));
  else if(ui.hist==='mois')l=l.filter(t=>t.date>=plusDays(-31));
  l.sort(byTime).reverse();
  const r=(v,t)=>`<label><input type="radio" name="hist" value="${v}" data-change="hist" ${ui.hist===v?'checked':''}> ${t}</label>`;
  return `<h2>Mes trajets</h2><div class="seg">${r('semaine','7 jours')}${r('mois','31 jours')}${r('tout','Tout')}</div>
  <div class="muted small" style="margin-bottom:6px">${l.length} trajet${l.length>1?'s':''}</div>
  ${l.length?l.map(t=>tcard(t,'t')).join(''):'<div class="empty">Aucun trajet sur cette période</div>'}`;
};
VIEWS.mesdem=()=>{
  const l=DB.demandes.filter(d=>d.transpId===me.id).sort((a,b)=>b.created-a.created);
  return `<h2>Mes demandes</h2><div class="muted small" style="margin-bottom:8px">Pour proposer un transport, allez dans « Mon planning » puis touchez « Proposer un autre transport » sur le trajet du client.</div>
  ${l.length?l.map(d=>`<div class="card"><div class="row sp"><b>${esc(cliName(d.clientId))} · ${fmtDate(d.date)}</b>${dTag(d)}</div>
  <div class="route">${esc(d.aller.heure)} · ${esc(d.aller.depart)} → ${esc(d.aller.arrivee)}</div>${d.motif?`<div class="small">Motif : ${esc(d.motif)}</div>`:''}</div>`).join(''):'<div class="empty">Aucune demande envoyée</div>'}`;
};
VIEWS.compte=()=>`<h2>Mon compte</h2><div class="card"><b>${esc(me.prenom)} ${esc(me.nom)}</b><div class="small muted">Identifiant : ${esc(me.ident)}</div><div class="small">Travail : ${esc(me.tel||'—')} · Perso : ${esc(me.tel2||'—')}</div></div>${pwdCard()}`;

function loginView(){
  return `<div class="login"><div style="text-align:center;margin-bottom:14px"><span class="logo" style="background:#f5b301;font-weight:800;border-radius:8px;padding:4px 12px;font-size:22px">ACE Taxi</span></div>
  <div class="card"><form data-form="login">${inp('Identifiant','ident','','autocomplete="username" autocapitalize="none" required')}${inp('Mot de passe','mdp','','type="password" autocomplete="current-password" required')}
  <button class="btn primary block">Se connecter</button></form>
  <div class="muted small">Premier accès : identifiant <b>patron</b>, mot de passe <b>patron</b> (à changer ensuite dans Paramètres).</div></div></div>`;
}
function render(){
  const app=$('#app');
  if(!me){app.innerHTML=loginView();return}
  const tabs=TABS[me.role];
  if(!tabs.some(t=>t[0]===ui.tab))ui.tab=tabs[0][0];
  const pend=DB.demandes.filter(d=>d.statut==='attente').length;
  app.innerHTML=`<header><span class="logo">ACE Taxi</span><span class="who">${esc(me.prenom)} ${esc(me.nom)}<br><span class="small">${me.role}</span></span><button data-act="logout">Quitter</button></header>
  <nav>${tabs.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-id="${k}">${l}${k==='demandes'&&pend?`<span class="dot">${pend}</span>`:''}</button>`).join('')}</nav>
  <main>${VIEWS[ui.tab]()}</main>`;
}

/* ====== Formulaires (fenêtres) ====== */
function trajetForm(t,pre){
  if(!DB.clients.length)return info('Pas encore de client','<div class="warn">Ajoutez d\'abord un client (onglet Clients).</div>');
  const v=t||pre||{};
  const tr=DB.users.filter(u=>u.role==='transporteur'&&(u.actif||u.id===v.transpId)).map(u=>[u.id,u.prenom+' '+u.nom]);
  modal(`<h3>${t?'Modifier le trajet n°'+t.num:'Nouveau trajet'}</h3>
  <form data-form="trajet" data-id="${t?t.id:''}" data-dem="${pre&&pre.demandeId||''}" data-rtouched="${(v.retour)?1:''}">
  ${sel('Client','client',DB.clients.map(c=>[c.id,c.nom]),v.clientId||'','required')}
  ${inp('Date','date',v.date||today(),'type="date" required')}
  ${sel('Transporteur','transp',[['','— Non attribué —'],...tr],v.transpId||'')}
  ${sel('Véhicule','veh',[['','— Aucun —'],...DB.vehicules.map(x=>[x.id,x.nom+(x.immat?' ('+x.immat+')':'')])],v.vehId||'')}
  ${legsFields(v.type,v.aller,v.retour)}
  ${inp('Note (facultatif)','notes',v.notes||'')}
  <button class="btn primary">${t?'Enregistrer':'Créer le trajet'}</button><button type="button" class="btn" data-act="closem">Annuler</button></form>`);
}
const forms={};
const acts={};
forms.trajet=f=>{
  const d=Object.fromEntries(new FormData(f));
  const L=readLegs(d);if(L.err)return formErr(f,L.err);
  if(!d.client||!d.date)return formErr(f,'Choisissez le client et la date.');
  let t=f.dataset.id?trj(f.dataset.id):null;
  if(t){
    t.clientId=d.client;t.date=d.date;t.transpId=d.transp||'';t.vehId=d.veh||'';t.notes=d.notes.trim();
    t.type=d.type;t.aller={...t.aller,...L.aller};
    t.retour=L.retour?{...(t.retour||{}),...L.retour}:null;
  }else{
    t={id:uid(),num:++DB.seq.t,clientId:d.client,date:d.date,transpId:d.transp||'',vehId:d.veh||'',type:d.type,aller:L.aller,retour:L.retour,notes:d.notes.trim(),annule:false,problemes:[]};
    DB.trajets.push(t);
    if(f.dataset.dem){const dm=DB.demandes.find(x=>x.id===f.dataset.dem);if(dm){dm.statut='acceptee';dm.trajetNum=t.num}}
  }
  save();render();
  if(t.transpId)openT(t.id);else closeModal();
};
forms.demande=f=>{
  const d=Object.fromEntries(new FormData(f));
  const L=readLegs(d);if(L.err)return formErr(f,L.err);
  if(!d.date)return formErr(f,'Choisissez la date.');
  const src=trj(f.dataset.id);
  const dm={id:uid(),num:++DB.seq.d,clientId:src.clientId,transpId:me.id,date:d.date,type:d.type,aller:L.aller,retour:L.retour,note:(d.note||'').trim(),statut:'attente',created:Date.now()};
  DB.demandes.push(dm);save();render();
  const body=`ACE Taxi - Demande n°${dm.num} de ${me.prenom} : ${cliName(dm.clientId)} le ${fmtDate(dm.date)} à ${dm.aller.heure}, de ${dm.aller.depart} à ${dm.aller.arrivee}.`+(dm.retour?` Retour à ${dm.retour.heure}, de ${dm.retour.depart} à ${dm.retour.arrivee}.`:'')+(dm.note?` Note : ${dm.note}`:'');
  smsModal('Demande enregistrée ✓',body,patronTargets(),'Le patron n\'a pas encore enregistré son numéro (Paramètres). Copiez le texte et envoyez-le-lui.');
};
forms.refus=f=>{
  const dm=DB.demandes.find(x=>x.id===f.dataset.id);
  dm.statut='refusee';dm.motif=new FormData(f).get('motif').trim();save();closeModal();render();
};
forms.probleme=f=>{
  const t=trj(f.dataset.id);const txt=new FormData(f).get('txt').trim();if(!txt)return formErr(f,'Écrivez le problème.');
  (t.problemes=t.problemes||[]).push({t:Date.now(),txt});save();render();
  smsModal('Problème enregistré ✓',`ACE Taxi - PROBLÈME trajet n°${t.num} (${cliName(t.clientId)}) : ${txt}`,patronTargets(),'Le patron n\'a pas encore enregistré son numéro (Paramètres). Copiez le texte et envoyez-le-lui.');
};
forms.client=f=>{
  const d=Object.fromEntries(new FormData(f));if(!d.nom.trim())return formErr(f,'Le nom est obligatoire.');
  let c=f.dataset.id?cli(f.dataset.id):null;
  if(!c){c={id:uid()};DB.clients.push(c)}
  Object.assign(c,{nom:d.nom.trim(),tel:d.tel.trim(),adresse:d.adresse.trim(),notes:d.notes.trim()});save();closeModal();render();
};
forms.vehicule=f=>{
  const d=Object.fromEntries(new FormData(f));if(!d.nom.trim())return formErr(f,'Le nom est obligatoire.');
  let v=f.dataset.id?veh(f.dataset.id):null;
  if(!v){v={id:uid()};DB.vehicules.push(v)}
  Object.assign(v,{nom:d.nom.trim(),immat:d.immat.trim(),ct:d.ct,entretien:d.entretien});save();closeModal();render();
};
forms.user=f=>{
  const d=Object.fromEntries(new FormData(f));
  const id=f.dataset.id;let u=id?usr(id):null;
  if(!u){
    const ident=d.ident.trim().toLowerCase();
    if(!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(ident))return formErr(f,'Identifiant : 3 à 30 caractères, lettres minuscules, chiffres, point, tiret.');
    if(DB.users.some(x=>x.ident===ident))return formErr(f,'Cet identifiant existe déjà.');
    if(!d.mdp||d.mdp.length<4)return formErr(f,'Mot de passe : 4 caractères minimum.');
    u={id:uid(),ident,mdp:d.mdp,role:'transporteur',actif:true};DB.users.push(u);
  }else{
    if(d.mdp){if(d.mdp.length<4)return formErr(f,'Mot de passe : 4 caractères minimum.');u.mdp=d.mdp}
    u.actif=!!d.actif;
  }
  Object.assign(u,{prenom:d.prenom.trim(),nom:d.nom.trim(),tel:d.tel.trim(),tel2:d.tel2.trim()});save();render();
  if(!id)info('Transporteur créé ✓',`<div class="smsbox">Identifiant : ${esc(u.ident)}\nMot de passe : ${esc(d.mdp)}</div><button class="btn" data-act="copy" data-txt="${esc('ACE Taxi - Identifiant : '+u.ident+' / Mot de passe : '+d.mdp)}">Copier les accès</button>`);
  else closeModal();
};
forms.patronTel=f=>{DB.params.patronTel=new FormData(f).get('tel').trim();save();info('Enregistré ✓','')};
forms.pwd=f=>{
  const d=Object.fromEntries(new FormData(f));
  if(d.p1!==d.p2)return formErr(f,'Les deux mots de passe sont différents.');
  me.mdp=d.p1;save();f.reset();info('Mot de passe changé ✓','');
};
forms.login=f=>{
  const d=Object.fromEntries(new FormData(f));
  const u=DB.users.find(x=>x.ident===d.ident.trim().toLowerCase()&&x.mdp===d.mdp&&x.actif);
  if(!u)return formErr(f,'Identifiant ou mot de passe incorrect.');
  me=u;try{localStorage.setItem(KEY_ME,u.id)}catch(e){}ui.tab=null;render();
};

/* ====== Détail d'un trajet (patron) ====== */
function openT(id){
  const t=trj(id);if(!t)return;
  const u=usr(t.transpId);
  const probs=(t.problemes||[]).map(p=>`<div class="warn">⚠ ${fmtDate(iso(new Date(p.t)))} ${hm(p.t)} : ${esc(p.txt)}</div>`).join('');
  modal(`<h3>Trajet n°${t.num} ${tag(t)}</h3>
  <div><b>${esc(cliName(t.clientId))}</b>${cli(t.clientId)&&cli(t.clientId).tel?` · <a href="tel:${esc(cleanNum(cli(t.clientId).tel))}">${esc(cli(t.clientId).tel)}</a>`:''}</div>
  <div class="small muted">${fmtDate(t.date)} · ${esc(usrName(t.transpId))} · ${t.vehId&&veh(t.vehId)?esc(veh(t.vehId).nom):'sans véhicule'}</div>
  ${legs(t).map(l=>legHtml(t,l,true)).join('')}${t.notes?`<div class="small">📝 ${esc(t.notes)}</div>`:''}${probs}
  <hr><b>Envoyer le trajet par SMS</b>
  ${t.transpId?smsBlock(smsTrajet(t),targetsFor(u),'Ce transporteur n\'a aucun numéro. Ajoutez-le dans Transporteurs → Modifier.'):'<div class="warn">Attribuez d\'abord un transporteur.</div>'}
  <hr><button class="btn" data-act="editT" data-id="${t.id}">Modifier</button>
  ${t.annule?`<button class="btn" data-act="unannul" data-id="${t.id}">Rétablir</button>`:`<button class="btn danger" data-act="annul" data-id="${t.id}">Annuler le trajet</button>`}
  <button class="btn" data-act="closem">Fermer</button>`);
}

/* ====== Actions (clics) ====== */
Object.assign(acts,{
  closem:(el,e)=>{if(el.id==='modal'&&e.target!==el)return;closeModal()},
  tab:el=>{ui.tab=el.dataset.id;render()},
  logout:()=>{me=null;try{localStorage.removeItem(KEY_ME)}catch(e){}render()},
  newT:()=>trajetForm(null),
  openT:el=>openT(el.dataset.id),
  editT:el=>trajetForm(trj(el.dataset.id)),
  annul:el=>{if(confirm('Annuler ce trajet ?')){trj(el.dataset.id).annule=true;save();render();openT(el.dataset.id)}},
  unannul:el=>{trj(el.dataset.id).annule=false;save();render();openT(el.dataset.id)},
  copy:el=>{
    const txt=el.dataset.txt;
    const done=()=>{el.textContent='✓ Copié'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));else fallbackCopy(txt,done);
  },
  step:el=>{
    const t=trj(el.dataset.id);const ns=nextStep(t);if(!ns)return;
    t[ns.leg][ns.step]=Date.now();save();render();
    const fini=!nextStep(t);
    const what=ns.step==='pris'?'personne prise en charge':'personne déposée';
    smsModal('Prévenir le patron ?',`ACE Taxi - Trajet n°${t.num} (${cliName(t.clientId)}) : ${ns.leg==='retour'?'retour, ':''}${what} à ${hm(t[ns.leg][ns.step])}.${fini?' Trajet terminé.':''}`,patronTargets(),'Le patron n\'a pas encore enregistré son numéro (Paramètres). Copiez le texte et envoyez-le-lui.');
  },
  prob:el=>modal(`<h3>Signaler un problème</h3><form data-form="probleme" data-id="${el.dataset.id}"><label class="f"><span>Que se passe-t-il ?</span><textarea name="txt" rows="3" required></textarea></label><button class="btn primary">Enregistrer</button><button type="button" class="btn" data-act="closem">Annuler</button></form>`),
  propose:el=>{
    const t=trj(el.dataset.id);
    modal(`<h3>Proposer un autre transport</h3><div class="muted small">Pour ${esc(cliName(t.clientId))}. Le patron choisira le transporteur et le véhicule.</div>
    <form data-form="demande" data-id="${t.id}">${inp('Date','date',t.date,'type="date" required')}${legsFields('simple',{depart:t.aller.arrivee},null)}${inp('Note (facultatif)','note','')}
    <button class="btn primary">Envoyer la demande</button><button type="button" class="btn" data-act="closem">Annuler</button></form>`);
  },
  accDem:el=>{
    const d=DB.demandes.find(x=>x.id===el.dataset.id);
    trajetForm(null,{clientId:d.clientId,date:d.date,transpId:d.transpId,type:d.type,aller:d.aller,retour:d.retour,notes:d.note,demandeId:d.id});
  },
  refDem:el=>modal(`<h3>Refuser la demande</h3><form data-form="refus" data-id="${el.dataset.id}">${inp('Motif (facultatif)','motif','')}<button class="btn danger">Refuser</button><button type="button" class="btn" data-act="closem">Annuler</button></form>`),
  newC:()=>clientForm(null),editC:el=>clientForm(cli(el.dataset.id)),
  newV:()=>vehForm(null),editV:el=>vehForm(veh(el.dataset.id)),
  newU:()=>userForm(null),editU:el=>userForm(usr(el.dataset.id)),
  delC:el=>{const id=el.dataset.id;if(DB.trajets.some(t=>t.clientId===id)||DB.demandes.some(d=>d.clientId===id))return info('Impossible','<div class="warn">Ce client a des trajets : on ne peut pas le supprimer.</div>');if(confirm('Supprimer ce client ?')){DB.clients=DB.clients.filter(c=>c.id!==id);save();closeModal();render()}},
  delV:el=>{const id=el.dataset.id;if(DB.trajets.some(t=>t.vehId===id))return info('Impossible','<div class="warn">Ce véhicule est utilisé dans des trajets.</div>');if(confirm('Supprimer ce véhicule ?')){DB.vehicules=DB.vehicules.filter(v=>v.id!==id);save();closeModal();render()}},
  noop:()=>{},
  export:()=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));
    a.download='ace-taxi-sauvegarde-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
  },
  wipe:()=>{if(confirm('Tout effacer (trajets, clients, transporteurs…) ?')&&confirm('Vraiment tout effacer ?')){DB=seed();me=DB.users[0];try{localStorage.setItem(KEY_ME,me.id)}catch(e){}save();render()}},
  demo:()=>{
    if(DB.clients.some(c=>c.demo))return info('Déjà ajoutées','');
    const c1={id:uid(),nom:'Mme Durand (démo)',tel:'0611223344',adresse:'12 rue des Lilas',notes:'',demo:1};
    const c2={id:uid(),nom:'M. Martin (démo)',tel:'0655443322',adresse:'3 place de la Mairie',notes:'',demo:1};
    DB.clients.push(c1,c2);
    const v1={id:uid(),nom:'Skoda Octavia',immat:'AB-123-CD',ct:plusDays(20),entretien:plusDays(90),demo:1};DB.vehicules.push(v1);
    let m=DB.users.find(u=>u.ident==='marion');
    if(!m){m={id:uid(),ident:'marion',mdp:'marion',role:'transporteur',prenom:'Marion',nom:'Demo',tel:'0600000001',tel2:'0600000002',actif:true};DB.users.push(m)}
    const mk=(c,h,dep,arr,type,ret)=>DB.trajets.push({id:uid(),num:++DB.seq.t,clientId:c.id,date:today(),transpId:m.id,vehId:v1.id,type,aller:{heure:h,depart:dep,arrivee:arr},retour:ret||null,notes:'',annule:false,problemes:[]});
    mk(c1,'14:00','12 rue des Lilas','Hôpital',"ar",{heure:'17:00',depart:'Hôpital',arrivee:'12 rue des Lilas'});
    mk(c2,'18:30','3 place de la Mairie','Gare','simple');
    save();render();info('Exemple ajouté ✓','<div class="small">Transporteur de test : identifiant <b>marion</b>, mot de passe <b>marion</b>. Dans Transporteurs, vous pouvez changer ses numéros.</div>');
  }
});
function fallbackCopy(txt,done){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
function clientForm(c){modal(`<h3>${c?'Modifier le client':'Nouveau client'}</h3><form data-form="client" data-id="${c?c.id:''}">${inp('Nom','nom',c&&c.nom,'required')}${inp('Téléphone','tel',c&&c.tel,'type="tel"')}${inp('Adresse habituelle','adresse',c&&c.adresse)}${inp('Notes','notes',c&&c.notes)}<button class="btn primary">Enregistrer</button><button type="button" class="btn" data-act="closem">Annuler</button>${c?`<button type="button" class="btn danger" data-act="delC" data-id="${c.id}">Supprimer</button>`:''}</form>`)}
function vehForm(v){modal(`<h3>${v?'Modifier le véhicule':'Nouveau véhicule'}</h3><form data-form="vehicule" data-id="${v?v.id:''}">${inp('Nom','nom',v&&v.nom,'required')}${inp('Immatriculation','immat',v&&v.immat)}${inp('Prochain contrôle technique','ct',v&&v.ct,'type="date"')}${inp('Prochain entretien','entretien',v&&v.entretien,'type="date"')}<button class="btn primary">Enregistrer</button><button type="button" class="btn" data-act="closem">Annuler</button>${v?`<button type="button" class="btn danger" data-act="delV" data-id="${v.id}">Supprimer</button>`:''}</form>`)}
function userForm(u){
  const sugg=Math.random().toString(36).slice(2,8);
  modal(`<h3>${u?'Modifier le transporteur':'Nouveau transporteur'}</h3><form data-form="user" data-id="${u?u.id:''}">
  ${u?`<div class="muted small">Identifiant : ${esc(u.ident)}</div>`:inp('Identifiant (ex. marion)','ident','','autocapitalize="none" required')}
  ${inp('Prénom','prenom',u&&u.prenom,'required')}${inp('Nom','nom',u&&u.nom,'required')}
  ${inp('Téléphone travail','tel',u&&u.tel,'type="tel"')}${inp('Téléphone perso','tel2',u&&u.tel2,'type="tel"')}
  ${inp(u?'Nouveau mot de passe (laisser vide pour ne pas changer)':'Mot de passe provisoire','mdp',u?'':sugg,u?'':'required')}
  ${u?`<label class="f"><span><input type="checkbox" name="actif" ${u.actif?'checked':''}> Compte actif (décochez pour désactiver)</span></label>`:''}
  <button class="btn primary">Enregistrer</button><button type="button" class="btn" data-act="closem">Annuler</button></form>`);
}

/* ====== Écouteurs ====== */
document.addEventListener('click',e=>{
  if(e.target.closest('a[href]'))return;
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=acts[el.dataset.act];if(a)a(el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target;const h=f.dataset&&f.dataset.form&&forms[f.dataset.form];
  if(h){e.preventDefault();h(f)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.change==='filt'){ui.filt=el.value;render();return}
  if(el.dataset.change==='hist'){ui.hist=el.value;render();return}
  if(el.dataset.change==='import'){
    const file=el.files[0];if(!file)return;
    file.text().then(txt=>{try{const d=JSON.parse(txt);if(!d.users||!d.trajets)throw 0;DB=d;save();me=DB.users.find(u=>u.id===me.id)||DB.users[0];render();info('Sauvegarde chargée ✓','')}catch(x){info('Fichier invalide','<div class="err">Ce fichier n\'est pas une sauvegarde ACE Taxi.</div>')}});
    return;
  }
  const f=el.form;if(!f||!['trajet','demande'].includes(f.dataset.form))return;
  if(el.name==='type'){const b=f.querySelector('.retour-box');if(b)b.style.display=el.value==='ar'?'block':'none';
    if(el.value==='ar'&&!f.dataset.rtouched)mirror(f)}
  if(el.name==='client'&&!f.elements.a_dep.value){const c=cli(el.value);if(c&&c.adresse){f.elements.a_dep.value=c.adresse;mirror(f)}}
});
function mirror(f){
  if(f.dataset.rtouched)return;
  f.elements.r_dep.value=f.elements.a_arr.value;f.elements.r_arr.value=f.elements.a_dep.value;
}
document.addEventListener('input',e=>{
  const el=e.target,f=el.form;if(!f||!['trajet','demande'].includes(f.dataset.form))return;
  if(el.name==='a_dep'||el.name==='a_arr')mirror(f);
  if(el.name==='r_dep'||el.name==='r_arr'||el.name==='r_heure')f.dataset.rtouched='1';
});
render();
</script>
</body>
</html>
